name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            ext: ""
            platform: Linux
            deps: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev libglfw3-dev
          - os: macos-latest
            goos: darwin
            ext: ""
            platform: Mac
            deps: ""
          - os: windows-latest
            goos: windows
            ext: ".exe"
            platform: Windows
            deps: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install system dependencies
        if: matrix.deps != ''
        run: ${{ matrix.deps }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Run tests
        run: go test ./core/ ./export/ -v

      - name: Build
        run: go build -ldflags="-s -w" -o "couic${{ matrix.ext }}" .

      - name: Create archive
        run: |
          ARCHIVE="couic-${{ github.ref_name }}-${{ matrix.platform }}.zip"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "${ARCHIVE}" "couic${{ matrix.ext }}"
          else
            zip "${ARCHIVE}" "couic${{ matrix.ext }}"
          fi
        shell: bash

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: couic-${{ github.ref_name }}-${{ matrix.platform }}
          path: couic-${{ github.ref_name }}-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: couic-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum couic-*.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            couic-*.zip
            checksums.txt
          generate_release_notes: true
